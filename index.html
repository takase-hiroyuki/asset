<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プレイヤー画面</title>
</head>
<body>
  <h1>プレイヤー画面</h1>

  <!-- ユーザー選択 -->
  <p>ユーザーを選択: 
    <select id="userSelect">
      <option value="user1">user1</option>
      <option value="user2">user2</option>
      <option value="user3">user3</option>
    </select>
  </p>

  <!-- 手番の表示とボタン -->
  <h3 id="currentTurnDisplay">現在の手番: 読み込み中...</h3>
  <button id="nextTurnBtn">手番を終わる（次の人へ）</button>

  <!-- 所持金とアイテムの表示 -->
  <h2>所持アイテム</h2>
  <p id="myMoneyDisplay">所持金: 読み込み中...</p>
  <ul id="myItemsList">
    <li>読み込み中...</li>
  </ul>

  <!-- 取引メニュー（追加部分） -->
  <hr>
  <h2>アイテムを渡す（自分の手番のみ）</h2>
  
  <p>
    渡すアイテム:
    <select id="tradeItemSelect">
      <option value="">-- 選択してください --</option>
    </select>
  </p>
  
  <p>
    渡す相手:
    <select id="tradeTargetSelect">
      <option value="user1">user1</option>
      <option value="user2">user2</option>
      <option value="user3">user3</option>
    </select>
  </p>
  
  <button id="tradeSubmitBtn">相手に提案する</button>

  <!-- 取引を提案されたときにメッセージや承諾ボタンを表示する場所 -->
  <div id="tradeOfferArea" display: none;">
    <!-- 取引の提案が来たときだけ、ここに内容が表示されます -->
  </div>

  <!-- JavaScriptの読み込み -->
  <script type="module" src="index.js"></script>
</body>
</html>
