<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プレイヤー画面</title>
</head>
<body>
  <h2>プレイヤー 画面</h2>  
  <!-- ユーザー選択 -->
  <label for="userSelect">ユーザーを選択:</label>
  <select id="userSelect">
    <option value="user1">user1</option>
    <option value="user2">user2</option>
    <option value="user3">user3</option>
  </select>
  <h3 id="currentTurnDisplay">現在の手番: 読み込み中...</h3>

  <!-- 選んだユーザーのアイテムを表示するリスト -->
  <h2>所持アイテム</h2>
  <ul id="myItemsList">
    <li>（アイテムを読み込み中...）</li>
  </ul>

  <!-- 外部のJSファイルを読み込む -->
  <script type="module" src="index.js"></script>
</body>
</html>
